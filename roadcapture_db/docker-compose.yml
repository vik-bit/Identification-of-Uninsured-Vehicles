# roadcapture source — isolated MySQL (IIA)
# Host port 3307 → container 3306 (native MySQL :3306 stays free for DWH)

services:
  roadcapture-mysql:
    image: mysql:8.0
    container_name: iia-roadcapture-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: roadcapture_root_pw
      MYSQL_DATABASE: roadcapture
      MYSQL_USER: iia_app
      MYSQL_PASSWORD: iia_app_pw
    ports:
      - "3307:3306"
    volumes:
      - roadcapture_mysql_data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uiia_app", "-piia_app_pw"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  roadcapture_mysql_data:
